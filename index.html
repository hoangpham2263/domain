<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Đường dẫn /go</title>
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="icon" href="brand/hp-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="base.css?v=4" />
    <link rel="stylesheet" href="style.css?v=8" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <a class="brand" href="https://hoangpham.is-a.dev" aria-label="HoangPham"><img src="brand/hp-icon.svg" alt="HoangPham" width="40" height="40" /></a>
        <div class="top-text"><h1>Đường dẫn /go</h1></div>
        <a class="back" href="https://hoangpham.is-a.dev/tools" aria-label="Portfolio">←<span> Portfolio</span></a>
      </header>
      <div class="content">

      <div class="layout">
        <div class="col">
      <!-- Paths under hoangpham.is-a.dev/go/<name>: no DNS change, nothing sent to is-a.dev -->
      <section class="card">
        <div class="sec-head"><h2>Đường dẫn /go</h2></div>
        <div class="go-add">
          <div class="search-box"><span class="suffix">/go/</span><input id="goName" placeholder="app" aria-label="Tên đường dẫn" /></div>
          <input id="goUrl" placeholder="https://… hoặc http://IP hosting" aria-label="Địa chỉ hosting" inputmode="url" />
          <select id="goMode" aria-label="Kiểu">
            <option value="redirect">Chuyển hướng</option>
            <option value="embed">Nhúng (giữ địa chỉ)</option>
          </select>
          <button id="goSave" class="primary" type="button">Lưu</button>
        </div>
        <p id="goStatus" class="status small"></p>
        <div id="goList" class="saved"></div>
      </section>
        </div>
        <div class="col">
      <section class="card">
        <form id="form" class="form" autocomplete="off">
          <details class="more">
            <summary>Tài khoản GitHub</summary>
            <label class="field token">
              <span>GitHub token (classic, quyền <code>public_repo</code>) · chỉ lưu trong trình duyệt này</span>
              <input name="token" type="password" placeholder="ghp_…" autocomplete="off" />
            </label>
          </details>
        </form>
      </section>
        </div>
      </div>

      <footer class="muted small">Làm bởi <a href="https://hoangpham.is-a.dev" target="_blank" rel="noopener">Phạm Quốc Hoàng</a> · MIT</footer>
      </div>
    </main>
    <script src="app.js?v=6"></script>
    <script src="go.js?v=2"></script>
  </body>
</html>
