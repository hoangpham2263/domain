<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Đường dẫn /go</title>
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="icon" href="brand/hp-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="base.css?v=5" />
    <link rel="stylesheet" href="style.css?v=12" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <a class="brand" href="https://hoangpham.is-a.dev" aria-label="HoangPham"><img src="brand/hp-icon.svg" alt="HoangPham" width="40" height="40" /></a>
        <div class="top-text"><h1>Đường dẫn /go</h1></div>
        <a class="back" href="https://hoangpham.is-a.dev/tools" aria-label="Portfolio">←<span> Portfolio</span></a>
      </header>
      <div class="content">

      <!-- Paths under hoangpham.is-a.dev/go/<name>: no DNS change, nothing sent to is-a.dev -->
      <section class="card">
        <div class="list-head">
          <h2>Danh sách đường dẫn</h2>
          <div class="actions">
            <button id="tokenOpen" type="button">Kết nối GitHub</button>
            <button id="addOpen" class="primary" type="button" hidden>Thêm đường dẫn</button>
          </div>
        </div>
        <p id="goStatus" class="status small" hidden></p>
        <table class="links">
          <thead>
            <tr><th class="c-name">Đường dẫn</th><th>Địa chỉ</th><th class="c-mode">Kiểu</th><th id="actHead" class="c-act" hidden></th></tr>
          </thead>
          <tbody id="goList"></tbody>
        </table>
      </section>

      <footer class="muted small">Làm bởi <a href="https://hoangpham.is-a.dev" target="_blank" rel="noopener">Phạm Quốc Hoàng</a> · MIT</footer>
      </div>
    </main>

    <dialog id="tokenDialog" class="dialog">
      <form id="tokenForm" class="form" autocomplete="off">
        <h2>Kết nối GitHub</h2>
        <p class="muted small">Bấm tạo token, ở mục Repository access chọn Only select repositories → <code>go</code>, bấm Generate token rồi dán vào ô dưới. Token chỉ lưu trong trình duyệt này.</p>
        <a class="btn" href="https://github.com/settings/personal-access-tokens/new?name=Go%20links&amp;description=Save%20links.json%20in%20hoangpham2263%2Fgo&amp;target_name=hoangpham2263&amp;expires_in=366&amp;contents=write" target="_blank" rel="noopener">Tạo token trên GitHub</a>
        <label class="field">
          <span>GitHub token</span>
          <input id="tokenInput" type="password" placeholder="github_pat_…" autocomplete="off" />
        </label>
        <p id="tokenStatus" class="status small" hidden></p>
        <div class="dialog-foot">
          <button id="tokenRemove" class="link" type="button" hidden>Ngắt kết nối</button>
          <div class="actions">
            <button type="button" data-close>Huỷ</button>
            <button id="tokenSave" class="primary" type="submit">Lưu</button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="go.js?v=5"></script>
  </body>
</html>
